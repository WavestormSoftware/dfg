name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lua: [lua5.1, lua5.4, luajit]
    steps:
      - uses: actions/checkout@v4
      - name: Install ${{ matrix.lua }}
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.lua }}
      - name: Run tests
        run: ${{ matrix.lua }} wavestorm_git/tests/test_git.lua
